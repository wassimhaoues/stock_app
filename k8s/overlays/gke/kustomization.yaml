# Overlay GKE — cible GitOps cloud pour ArgoCD.
# Différences principales par rapport à l'overlay gitops local :
#   - exposition via Ingress GKE au lieu de NodePort
#   - CORS backend aligné sur le futur domaine public
#   - mêmes images GHCR taguées en sha-* et mises à jour par le pipeline CD
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stockpro

resources:
  - ../../base
  - ../../base/monitoring
  - managed-certificate.yaml
  - ingress.yaml

images:
  - name: stockpro-backend
    newName: ghcr.io/wassimhaoues/stockpro-backend
    newTag: sha-40e95bc
  - name: stockpro-frontend
    newName: ghcr.io/wassimhaoues/stockpro-frontend
    newTag: sha-59a5538

patches:
  - path: patches/backend-config-cors.yaml
